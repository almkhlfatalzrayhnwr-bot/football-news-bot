name: مراقبة أخبار كرة القدم

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقائق (الحد الأدنى المسموح في GitHub Actions)
  workflow_dispatch: {}      # يسمح بالتشغيل اليدوي من تطبيق/موقع GitHub لأي وقت

permissions:
  contents: write            # مطلوب لحفظ ملف الحالة (processed_articles.json) داخل المستودع

concurrency:
  group: football-news-monitor
  cancel-in-progress: false   # يستنى دوره بدل ما يتلغي، عشان منفوتش أي دورة فحص

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المتطلبات
        run: pip install feedparser requests

      - name: تشغيل المراقبة
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: حفظ ملف الحالة (إن تغيّر)
        run: |
          git config user.name "football-news-bot"
          git config user.email "actions@github.com"
          git add processed_articles.json
          git diff --quiet --cached || git commit -m "تحديث المقالات المعالجة [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "محاولة $i فشلت، إعادة المحاولة بعد ثانيتين..."
            sleep 2
          done
